<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Project Management Professional PMP Badge</title>
  <desc id="desc">A professional badge showing the PMP credential issued by the Project Management Institute.</desc>
  <defs>
    <linearGradient id="gold" x1="90" y1="50" x2="330" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1d78a"/>
      <stop offset=".48" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#8d6f24"/>
    </linearGradient>
    <linearGradient id="ink" x1="95" y1="80" x2="325" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#191b27"/>
      <stop offset="1" stop-color="#09090f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>
  <circle cx="210" cy="210" r="178" fill="url(#ink)" filter="url(#shadow)"/>
  <circle cx="210" cy="210" r="166" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="210" cy="210" r="135" fill="none" stroke="#c9a84c" stroke-opacity=".35" stroke-width="2"/>
  <path d="M210 76 241 139 310 149 260 198 272 267 210 234 148 267 160 198 110 149 179 139Z" fill="#c9a84c" opacity=".16"/>
  <text x="210" y="193" text-anchor="middle" fill="#f3df9a" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="4">PMP</text>
  <text x="210" y="232" text-anchor="middle" fill="#ece9e2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">CERTIFIED</text>
  <line x1="118" y1="255" x2="302" y2="255" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  <text x="210" y="286" text-anchor="middle" fill="#8a8fa3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">PROJECT MANAGEMENT</text>
  <text x="210" y="310" text-anchor="middle" fill="#8a8fa3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">PROFESSIONAL</text>
  <text x="210" y="352" text-anchor="middle" fill="#c9a84c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">PMI CREDENTIAL</text>
</svg>
